# Fuzzing harness for the decoder (issue #18). Kept in its own detached
# workspace (the empty `[workspace]` table below) so it never enters the
# library's dependency graph: `cargo build`, `cargo test`, `cargo clippy
# --all-targets`, and `cargo deny check` at the repo root do not see
# `libfuzzer-sys`, and the no-C-dependency / cross-compile guarantee for
# `rust-j2k` itself is preserved. This crate only builds under
# `cargo +nightly fuzz`.
[package]
name = "rust-j2k-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rust-j2k]
path = ".."

# One binary per target. `decode` drives the public entry point.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]

# `tile_body` pins a valid main header and fuzzes only the tile-part bytes, so
# mutations reach the packet reader instead of dying in parse_main_header.
[[bin]]
name = "tile_body"
path = "fuzz_targets/tile_body.rs"
test = false
doc = false
bench = false

# `tier1_block` and `mq` drive the deep state machines through the library's
# `--cfg fuzzing` hooks (rust_j2k::fuzz).
[[bin]]
name = "tier1_block"
path = "fuzz_targets/tier1_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mq"
path = "fuzz_targets/mq.rs"
test = false
doc = false
bench = false
