# Fuzzing harness for the decoder (issue #18). Kept in its own detached
# workspace (the empty `[workspace]` table below) so it never enters the
# library's dependency graph: `cargo build`, `cargo test`, `cargo clippy
# --all-targets`, and `cargo deny check` at the repo root do not see
# `libfuzzer-sys`, and the no-C-dependency / cross-compile guarantee for
# `rust-j2k` itself is preserved. This crate only builds under
# `cargo +nightly fuzz`.
[package]
name = "rust-j2k-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rust-j2k]
path = ".."

# One binary per target. `decode` drives the public entry point.
[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]

# `tile_body` pins a valid main header and fuzzes only the tile-part bytes, so
# mutations reach the packet reader instead of dying in parse_main_header.
[[bin]]
name = "tile_body"
path = "fuzz_targets/tile_body.rs"
test = false
doc = false
bench = false

# `tier1_block` and `mq` drive the deep state machines through the library's
# `--cfg fuzzing` hooks (rust_j2k::fuzz).
[[bin]]
name = "tier1_block"
path = "fuzz_targets/tier1_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mq"
path = "fuzz_targets/mq.rs"
test = false
doc = false
bench = false

# `jp2_boxes` pins a valid codestream and fuzzes the JP2 boxes around it, so
# mutations reach the box reader and a valid file is one step from a decode.
[[bin]]
name = "jp2_boxes"
path = "fuzz_targets/jp2_boxes.rs"
test = false
doc = false
bench = false

# `header` drives the public header-only entry point and checks it against
# `decode` on the same input.
[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

# `icc_srgb` pins the codestream and boxes and fuzzes the ICC profile under
# `ColorOutput::Srgb`: the profile parser and the LittleCMS port.
[[bin]]
name = "icc_srgb"
path = "fuzz_targets/icc_srgb.rs"
test = false
doc = false
bench = false
# `decode_partial` drives the public entry point with `strict` off, on whole
# inputs and on prefixes, and checks it against the strict decode.
[[bin]]
name = "decode_partial"
path = "fuzz_targets/decode_partial.rs"
test = false
doc = false
bench = false

# `ht_block` drives the HTJ2K block decoder directly through the library's
# `--cfg fuzzing` hook (rust_j2k::fuzz), over the full shape and segment range.
[[bin]]
name = "ht_block"
path = "fuzz_targets/ht_block.rs"
test = false
doc = false
bench = false

# `incremental_decode` feeds the input to `IncrementalDecoder` in pieces and
# checks each refine against the one-shot decode with `strict` off of the
# same bytes.
[[bin]]
name = "incremental_decode"
path = "fuzz_targets/incremental_decode.rs"
test = false
doc = false
bench = false

# `window_crop` checks a window, a tile and a component subset against the
# crop or selection of the whole decode.
[[bin]]
name = "window_crop"
path = "fuzz_targets/window_crop.rs"
test = false
doc = false
bench = false

# `retry_ladder` follows `DecodeOptions::with_retry` from each limit refusal
# and checks the options it gives and the image it ends at.
[[bin]]
name = "retry_ladder"
path = "fuzz_targets/retry_ladder.rs"
test = false
doc = false
bench = false

# `header_split` feeds `IncrementalDecoder` in pieces and checks each
# `header()` against `read_header_with`, strict off, on the bytes fed so far.
[[bin]]
name = "header_split"
path = "fuzz_targets/header_split.rs"
test = false
doc = false
bench = false
