name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Mon 06:00 UTC — catches new rules added to the rule packs.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab
  pull-requests: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # SARIF upload to GitHub Code Scanning needs either a public repo or GitHub
    # Advanced Security. Skip until the repo is public.
    if: github.event.repository.visibility == 'public'
    # Pinned by digest like every other dependency here. Dependabot can't bump
    # it: the docker ecosystem reads only Dockerfiles, Compose files and
    # Kubernetes/Helm YAML, and the github-actions ecosystem reads only
    # `uses:` references. Bump by hand: take the digest of the newest tag at
    # least 7 days old (the Dependabot cooldown) from Docker Hub.
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        # No --error: surface findings in the Security tab without breaking the
        # build until they're triaged. Flip on --error once findings are at zero.
        run: |
          semgrep scan \
            --sarif --output=semgrep.sarif \
            --config p/default \
            --config p/security-audit \
            --config p/rust \
            --config p/secrets \
            --config p/github-actions

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
