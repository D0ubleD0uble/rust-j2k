name: CI

# Quality gates from .claude/rules/conventions.md. These run on every PR and on
# pushes to main; enable them as required status checks in branch protection.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Must match rust-version in Cargo.toml. The pin is only a claim until this
      # job proves the crate still builds on it, so bump both together.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  package-hygiene:
    name: package hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # The ISO/IEC 15444-4 conformance corpus is committed for tests but carries
      # a conformance-only license, so it must never ship in the packaged crate
      # (see tests/fixtures/conformance/COPYRIGHT and the `exclude` in Cargo.toml).
      # Guard that invariant against an accidental include/exclude regression.
      - name: Conformance corpus stays out of the package
        run: |
          if cargo package --list --allow-dirty | grep -q 'tests/fixtures/conformance/'; then
            echo "::error::conformance corpus is in the packaged crate; it is license-restricted and must stay excluded"
            exit 1
          fi

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-fuzz
      # Short robustness smoke over every target: the goal is to catch panics
      # on malformed input, not to find deep bugs, so keep each run bounded.
      # `cargo fuzz build` first so a target that stops compiling fails the job
      # explicitly rather than inside a run step.
      # Pin the gnu host triple: cargo-fuzz otherwise defaults to a musl target
      # whose std isn't installed on the runner.
      - name: Build all fuzz targets
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      # The codestream-reading targets take the J2K marker dictionary so
      # mutation can splice whole marker codes instead of rediscovering them.
      - name: Fuzz decode (60s)
        run: cargo fuzz run decode --target x86_64-unknown-linux-gnu -- -dict=fuzz/j2k.dict -max_total_time=60 -rss_limit_mb=4096
      - name: Fuzz tile_body (45s)
        run: cargo fuzz run tile_body --target x86_64-unknown-linux-gnu -- -dict=fuzz/j2k.dict -max_total_time=45 -rss_limit_mb=4096
      - name: Fuzz tier1_block (30s)
        run: cargo fuzz run tier1_block --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=4096
      - name: Fuzz mq (15s)
        run: cargo fuzz run mq --target x86_64-unknown-linux-gnu -- -max_total_time=15 -rss_limit_mb=4096
