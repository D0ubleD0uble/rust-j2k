name: Dependabot auto-merge

# Enable auto-merge for low-risk Dependabot updates so they land without manual
# babysitting once CI is green. Branch protection still gates the actual merge
# on the required checks, and Dependabot keeps the branch rebased while it waits.
# Higher-risk bumps stay manual (see the gate below).
#
# Runs on pull_request_target so the GITHUB_TOKEN has write scope (Dependabot
# PRs otherwise get a read-only token). This is safe because the job never
# checks out or executes the PR's code — it only reads trusted metadata and
# calls the GitHub API. The branch protection here requires zero approvals, so
# we only enable auto-merge; no review-approval step is needed.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for low-risk updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      # Auto-merge patch bumps only. Anything wider — dev-dependency minors
      # included — stays manual: dev dependencies run inside CI with access to
      # its secrets, so a compromised minor is not low-risk. For grouped PRs
      # the update-type reflects the highest-risk member, so the gate stays
      # conservative.
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
